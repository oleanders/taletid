version: 1.0.{build}

environment:
  matrix:
    - nodejs_version: "22"

install:
  - ps: Install-Product node $env:nodejs_version
  - npm ci
    
build_script:
  - npm run build

deploy_script:
  - ps: |
      if ($env:APPVEYOR_REPO_BRANCH -eq 'master' -and !$env:APPVEYOR_PULL_REQUEST_NUMBER) {
        npm install -g firebase-tools
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        firebase deploy --non-interactive --only hosting --project $env:FIREBASE_PROJECT --token=$env:FIREBASE_API_TOKEN
        exit $LASTEXITCODE
      }
