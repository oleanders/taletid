version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: elm
    directory: "/"
    schedule:
      interval: daily
    groups:
      elm:
        patterns: ["*"]
      elm-security:
        applies-to: security-updates
        patterns: ["*"]
